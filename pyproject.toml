[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-photo-cleaner"
version = "1.0.0"
description = "100% Private, offline 3-tier photo library sorter using local Ollama vision models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ollama>=0.4.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
photo-cleaner = "cleaner:main"
